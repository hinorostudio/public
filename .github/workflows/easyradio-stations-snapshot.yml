name: EasyRadio station snapshot

# Weekly backup of the Radio Browser catalogue, so the EasyRadio app has a
# station source that does not depend on radio-browser.info.
# Published as assets of the fixed release tag below (stable download URL):
#   https://github.com/hinorostudio/public/releases/download/easyradio-stations/stations.json.gz
#   https://github.com/hinorostudio/public/releases/download/easyradio-stations/meta.json

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC (off the hour: less queueing)
  workflow_dispatch:

permissions:
  contents: write # upload release assets + commit meta.json

concurrency:
  group: easyradio-stations-snapshot
  cancel-in-progress: false

env:
  RELEASE_TAG: easyradio-stations
  SNAPSHOT_DIR: easyradio/snapshot
  GH_TOKEN: ${{ github.token }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Fails (and leaves the published snapshot untouched) if the API is down,
      # the answer is truncated, or the catalogue shrank by more than 20%.
      - name: Build snapshot
        run: |
          python3 "$SNAPSHOT_DIR/build_snapshot.py" \
            --out "$RUNNER_TEMP/snapshot" \
            --previous-meta "$SNAPSHOT_DIR/meta.json"
          gzip -t "$RUNNER_TEMP/snapshot/stations.json.gz"

      - name: Publish release assets
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "EasyRadio station snapshot" \
              --latest=false \
              --notes "Weekly trimmed copy of the [Radio Browser](https://www.radio-browser.info) station catalogue (public domain), used by the EasyRadio app as a fallback source. Overwritten in place by the \`EasyRadio station snapshot\` workflow - see \`easyradio/snapshot/\`."
          fi
          # Keep the outgoing snapshot one week as a manual rollback.
          if gh release download "$RELEASE_TAG" --pattern stations.json.gz --dir "$RUNNER_TEMP/previous" 2>/dev/null; then
            mv "$RUNNER_TEMP/previous/stations.json.gz" "$RUNNER_TEMP/previous/stations-previous.json.gz"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/previous/stations-previous.json.gz" --clobber
          fi
          # Data first, meta last: meta.json never describes a file that is not there yet.
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/snapshot/stations.json.gz" --clobber
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/snapshot/meta.json" --clobber

      - name: Verify the public download
        run: |
          expected=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['sha256'])" "$RUNNER_TEMP/snapshot/meta.json")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/stations.json.gz"
          for attempt in 1 2 3 4 5; do
            actual=$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1 || true)
            if [ "$actual" = "$expected" ]; then echo "OK $url"; exit 0; fi
            echo "attempt $attempt: got '$actual', expected '$expected'"; sleep 15
          done
          exit 1

      # The commit is also what keeps this schedule alive: GitHub disables cron
      # workflows in public repos after 60 days without repository activity.
      - name: Commit meta.json
        run: |
          cp "$RUNNER_TEMP/snapshot/meta.json" "$SNAPSHOT_DIR/meta.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT_DIR/meta.json"
          stations=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['stations'])" "$SNAPSHOT_DIR/meta.json")
          git commit -m "easyradio: station snapshot $(date -u +%F) ($stations stations)"
          git pull --rebase
          git push
